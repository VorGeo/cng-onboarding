[project]
name = "CNG-tutorials"
description = "Cloud-Native Geospatial (CNG) tutorials"
authors = [{name = "Tyler Erickson", email = "tyler@vorgeo.com"}]
dependencies = []
requires-python = ">= 3.11"
version = "0.1.0"

[project.optional-dependencies]
dev = ["black>=25.1.0", "isort>=5.13.0"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]
include = '\.pyi?$'
